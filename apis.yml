aid: greypoint-industries
name: Greypoint Industries
description: >-
  Greypoint Industries is a Canadian defense-technology company (Y Combinator
  S26) building passive RF mapping software that charts the electromagnetic
  spectrum so operators can see every signal, track every threat, and act
  first — "built in Canada for those who protect." Founded in 2026 by Nic Chu,
  Jordan Khoo, Steven Xu, and Darcy Zhang, the company also develops
  mass-produced autonomous counter-drone interceptors designed to defeat
  drone-swarm saturation at a fraction of the cost of the targets. As an
  early-stage hardware and software startup, Greypoint currently publishes no
  public API, developer portal, SDK, or machine-readable specification; this
  profile captures the company's identity for the API Evangelist network and
  awaits a developer surface to enrich.
